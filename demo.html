<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MarMail — AI Multi-Agent Email Marketing on Amazon Bedrock AgentCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --bg-deep:#060E20; --surface:#101A30; --surface-2:#16223C; --surface-3:#1C2A47;
  --line:rgba(0,212,255,.14); --line-soft:rgba(148,163,184,.12);
  --text:#E6EDF7; --text-2:#9FB0C7; --text-3:#64748B;
  --cyan:#00D4FF; --cyan-dim:rgba(0,212,255,.12); --purple:#8B5CF6; --purple-dim:rgba(139,92,246,.14);
  --teal:#10B981; --teal-dim:rgba(16,185,129,.12); --amber:#F59E0B; --amber-dim:rgba(245,158,11,.12);
  --red:#EF4444; --red-dim:rgba(239,68,68,.12);
  --r-sm:10px; --r-md:14px; --r-lg:18px;
  --font:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% -10%,rgba(0,212,255,.07),transparent 60%),
             radial-gradient(800px 500px at 90% 0%,rgba(139,92,246,.08),transparent 60%),
             radial-gradient(700px 600px at 50% 110%,rgba(16,185,129,.04),transparent 60%)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22314E;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2E4066}
::selection{background:rgba(0,212,255,.25)}
a{color:var(--cyan);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:rgba(0,212,255,.5);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
select option{background:var(--surface-2)}
.mono{font-family:var(--mono)}

/* ============ LAYOUT ============ */
#app{display:flex;height:100vh;position:relative;z-index:1}
.sidebar{width:236px;flex-shrink:0;background:rgba(9,15,29,.85);backdrop-filter:blur(12px);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;transition:width .25s ease;z-index:30}
.sidebar.collapsed{width:68px}
.side-logo{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line-soft);min-height:64px}
.side-logo svg{flex-shrink:0}
.side-logo .brand-txt{white-space:nowrap;overflow:hidden;transition:opacity .2s}
.sidebar.collapsed .brand-txt{opacity:0;width:0}
.nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--text-2);font-weight:500;font-size:13.5px;transition:all .18s;position:relative;white-space:nowrap}
.nav-item svg{flex-shrink:0;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{color:var(--text);background:rgba(148,163,184,.07)}
.nav-item.active{color:var(--cyan);background:var(--cyan-dim)}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.nav-item .nav-badge{margin-left:auto;background:var(--purple-dim);color:#C4B5FD;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px}
.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-badge{display:none}
.side-foot{padding:12px;border-top:1px solid var(--line-soft)}
.collapse-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:var(--r-sm);color:var(--text-3);font-size:12px}
.collapse-btn:hover{background:rgba(148,163,184,.07);color:var(--text-2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:64px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line-soft);background:rgba(11,18,32,.7);backdrop-filter:blur(12px)}
.search-wrap{position:relative;width:340px;max-width:34%}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2}
.search-wrap input{width:100%;padding-left:36px;background:rgba(148,163,184,.06);border-color:transparent}
.search-wrap input::placeholder{color:var(--text-3)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{position:relative;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--text-2);border:1px solid transparent;transition:all .18s}
.icon-btn:hover{background:rgba(148,163,184,.08);color:var(--text)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,212,255,.4);object-fit:cover}
.user-meta{display:flex;flex-direction:column;line-height:1.25}
.user-meta b{font-size:12.5px;font-weight:600}
.user-meta span{font-size:11px;color:var(--text-3)}
.content{flex:1;overflow-y:auto;padding:26px 28px 0;scroll-behavior:smooth}
.footer{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--text-3)}
.health-pill{display:flex;align-items:center;gap:7px;padding:4px 12px;border-radius:99px;background:var(--teal-dim);color:var(--teal);font-weight:600;font-size:11px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

/* ============ COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border-radius:var(--r-sm);padding:9px 16px;transition:all .18s;border:1px solid transparent}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(135deg,#00D4FF,#00A8FF);color:#04121E;box-shadow:0 4px 20px rgba(0,212,255,.3)}
.btn-primary:hover{box-shadow:0 6px 26px rgba(0,212,255,.45);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-ghost{border-color:var(--line-soft);color:var(--text-2)}
.btn-ghost:hover{color:var(--text);border-color:rgba(148,163,184,.3);background:rgba(148,163,184,.06)}
.btn-danger{background:var(--red-dim);color:var(--red)}
.card{background:linear-gradient(160deg,rgba(22,34,60,.55),rgba(16,26,48,.55));border:1px solid var(--line-soft);border-radius:var(--r-lg);backdrop-filter:blur(8px);position:relative}
.card.glow{border-color:rgba(0,212,255,.28);box-shadow:0 0 0 1px rgba(0,212,255,.08),0 8px 40px -12px rgba(0,212,255,.18)}
.card-pad{padding:20px 22px}
.card-title{font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card-title svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.01em}
.chip .cdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-teal{background:var(--teal-dim);color:var(--teal)}
.chip-cyan{background:var(--cyan-dim);color:var(--cyan)}
.chip-purple{background:var(--purple-dim);color:#C4B5FD}
.chip-amber{background:var(--amber-dim);color:var(--amber)}
.chip-red{background:var(--red-dim);color:var(--red)}
.chip-gray{background:rgba(148,163,184,.12);color:var(--text-2)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--line-soft)}
table.data td{padding:12px 14px;border-bottom:1px solid rgba(148,163,184,.06)}
table.data tbody tr{transition:background .15s}
table.data tbody tr:hover{background:rgba(0,212,255,.03)}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field{margin-bottom:16px}
.hint{font-size:11.5px;color:var(--text-3);margin-top:5px}
.range-wrap{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--cyan) var(--fill,50%),#22314E var(--fill,50%));padding:0;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.5);cursor:pointer}
.range-val{font-family:var(--mono);font-size:13px;color:var(--cyan);min-width:34px;text-align:right;font-weight:600}
.chip-select{display:flex;flex-wrap:wrap;gap:7px}
.sel-chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line-soft);font-size:12px;font-weight:500;color:var(--text-2);transition:all .15s;background:rgba(148,163,184,.04)}
.sel-chip:hover{border-color:rgba(0,212,255,.4);color:var(--text)}
.sel-chip.on{background:var(--cyan-dim);border-color:rgba(0,212,255,.55);color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.15)}
.seg{display:flex;background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-3)}
.seg button.on{background:var(--surface-3);color:var(--text)}
/* stepper */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:24px}
.step{display:flex;align-items:center;gap:10px}
.step .s-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid var(--line-soft);color:var(--text-3);background:var(--surface);transition:all .3s;flex-shrink:0}
.step .s-label{font-size:13px;font-weight:600;color:var(--text-3);white-space:nowrap}
.step.done .s-dot{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}
.step.done .s-label{color:var(--teal)}
.step.now .s-dot{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px rgba(0,212,255,.35)}
.step.now .s-label{color:var(--text)}
.step-bar{width:56px;height:2px;background:var(--line-soft);margin:0 12px;position:relative;overflow:hidden;border-radius:2px}
.step-bar i{position:absolute;inset:0;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
.step-bar.fill i{transform:scaleX(1)}
/* agent node */
.agent-node{background:linear-gradient(160deg,rgba(22,34,60,.7),rgba(14,22,40,.7));border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px 16px;position:relative;transition:all .3s;backdrop-filter:blur(6px)}
.agent-node .an-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.ai-orb{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ai-orb svg{width:14px;height:14px}
.orb-cyan{background:var(--cyan-dim);color:var(--cyan)}
.orb-purple{background:var(--purple-dim);color:#C4B5FD}
.orb-teal{background:var(--teal-dim);color:var(--teal)}
.orb-amber{background:var(--amber-dim);color:var(--amber)}
.agent-node.running{border-color:rgba(0,212,255,.55);box-shadow:0 0 24px -4px rgba(0,212,255,.35),inset 0 0 20px rgba(0,212,255,.04)}
.agent-node.running .ai-orb::after{content:'';position:absolute;inset:-4px;border-radius:11px;border:1.5px solid rgba(0,212,255,.5);animation:ringPulse 1.4s ease-out infinite}
@keyframes ringPulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.agent-node.success{border-color:rgba(16,185,129,.45)}
.agent-node.failed{border-color:rgba(239,68,68,.5)}
.spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(0,212,255,.2);border-top-color:var(--cyan);animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* logs */
.log-panel{font-family:var(--mono);font-size:11.5px;line-height:1.85;padding:16px 18px;overflow-y:auto;flex:1}
.log-line{display:flex;gap:10px;opacity:0;animation:logIn .3s forwards}
@keyframes logIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.log-ts{color:var(--text-3);flex-shrink:0}
.lg-info{color:#8FB8D8}.lg-agent{color:var(--cyan)}.lg-crit{color:#C4B5FD}.lg-ok{color:var(--teal)}.lg-warn{color:var(--amber)}.lg-err{color:var(--red)}.lg-tok{color:#7DD3FC}
/* toast */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line-soft);border-left:3px solid var(--cyan);border-radius:var(--r-md);padding:12px 16px;min-width:300px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);font-size:13px}
.toast.ok{border-left-color:var(--teal)}
.toast.err{border-left-color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,18,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:560px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.6);animation:modalIn .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.metric-num{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spark{display:block}
.empty-state{text-align:center;padding:52px 20px;color:var(--text-3)}
.empty-state svg{width:44px;height:44px;stroke:var(--text-3);fill:none;stroke-width:1.4;margin-bottom:14px;opacity:.7}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(148,163,184,.1);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:6px;background:#1B2942;overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .5s ease;box-shadow:0 0 10px rgba(0,212,255,.4)}
.dropdown{position:absolute;top:44px;right:0;width:320px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:60;overflow:hidden;animation:modalIn .2s}
.notif-item{padding:12px 15px;border-bottom:1px solid rgba(148,163,184,.07);font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.notif-item:hover{background:rgba(148,163,184,.05)}
.notif-item .nd{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.fade-up{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.14s}.stagger>*:nth-child(5){animation-delay:.18s}.stagger>*:nth-child(6){animation-delay:.22s}
.grid-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:800;letter-spacing:-.02em}
.page-sub{font-size:13px;color:var(--text-2);margin-top:3px}
.tooltip{position:relative}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <main class="content" id="view"></main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script>
const Backend = (() => {
  const DB_KEY = 'marmail_db_v3';
  const listeners = {}; // event bus
  const on = (ev, fn) => { (listeners[ev] = listeners[ev] || []).push(fn); return () => { listeners[ev] = listeners[ev].filter(f => f !== fn); }; };
  const emit = (ev, data) => (listeners[ev] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } });
  const latency = (ms) => new Promise(r => setTimeout(r, ms + Math.random() * 120));
  const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 8).toUpperCase();
  const now = () => Date.now();
  const ago = (mins) => now() - mins * 60000;

  /* ---------- data pools for procedural generation ---------- */
  const FIRST = ['Elena','Marcus','Priya','David','Sofia','James','Aisha','Tom','Nina','Oliver','Grace','Leo','Maya','Ethan','Isla','Noah','Zara','Lucas','Ivy','Henry','Ruby','Felix','Chloe','Omar','Lena','Victor','Anya','Julian','Tessa','Ravi','Mira','Kai','Freya','Diego','Hana','Theo','Ingrid','Sam','Lara','Owen'];
  const LAST = ['Vasquez','Chen','Sharma','Okafor','Lindqvist','Moreau','Tanaka','Novak','Silva','Kim','Haddad','Fischer','Rossi','Nakamura','Bergström','Dubois','Mehta','Petrov','Kowalski','Nguyen','Alvarez','Fitzgerald','Osei','Larsen','Romano','Weber','Costa','Ivanov','Sato','Mendes','Haas','Verma','Bakker','Klein','Santos','Reyes','Marek','Lund','Adeyemi','Brooks'];
  const COMPANIES = { 'SaaS / Software': ['NimbusIQ','Flowstack','Quantiva','Brightloom','Hexafold','Cloudhaven','Dataweave','Kitebase','Stratosly','Vektorly','Pulsegrid','Orbitlane'], 'Fintech': ['Ledgerly','Paystride','Vaultora','Finchpay','Clearcoin','Trustline','Meridian Pay'], 'Healthcare Tech': ['Medlyra','Carepointe','Vitalsync','Healthgrid','Neurospark'], 'E-commerce': ['Cartloop','Vendora','Shopwire','Mergely','Parcelpay'], 'AI / ML': ['Synthmind','Neuralis','Promptbase','Cognivia','Latentspace'], 'DevTools': ['Gitstream','Deploykit','Apipulse','Containerly','Buildhive'] };
  const DOMAINS = { 'SaaS / Software':'io','Fintech':'com','Healthcare Tech':'health','E-commerce':'shop','AI / ML':'ai','DevTools':'dev' };
  const TITLE_BY = { 'VP Engineering': ['VP Engineering','VP of Engineering','Head of Engineering','Director of Engineering'], 'CTO': ['CTO','Chief Technology Officer'], 'Head of Growth': ['Head of Growth','VP Growth','Director of Growth Marketing'], 'CPO': ['CPO','Chief Product Officer'], 'Engineering Manager': ['Engineering Manager','Senior Engineering Manager','Platform Lead'] };
  const SIZE_LABEL = { '1-50':'Startup (1–50)', '51-200':'Growth (51–200)', '201-1000':'Scale-up (201–1k)', '1000+':'Enterprise (1k+)' };
  const LOCS = ['San Francisco, US','New York, US','Austin, US','London, UK','Berlin, DE','Amsterdam, NL','Toronto, CA','Singapore','Sydney, AU','Bangalore, IN','Tel Aviv, IL','Stockholm, SE','Paris, FR','Dublin, IE'];
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const rand = (a, b) => Math.floor(a + Math.random() * (b - a + 1));

  function genLead(criteria, source, status, fetchedAt) {
    const f = pick(FIRST), l = pick(LAST);
    const comp = pick(COMPANIES[criteria.industry] || COMPANIES['SaaS / Software']);
    const domain = DOMAINS[criteria.industry] || 'io';
    return {
      id: uid('LD'), name: f + ' ' + l,
      email: (f + '.' + l).toLowerCase().replace(/[^a-z.]/g, '') + '@' + comp.toLowerCase().replace(/[^a-z]/g, '') + '.' + domain,

  /* ---------- helpers ---------- */
  const campaignById = (id) => db.campaigns.find(c => c.id === id);
  const money = (n) => '$' + n.toFixed(2);

  const totals = () => db.campaigns.reduce((a, c) => ({ sent: a.sent + c.stats.sent, bounced: a.bounced + c.stats.bounced, failed: a.failed + c.stats.failed, cost: a.cost + c.cost.usd, tokens: a.tokens + c.cost.tokens, fetched: a.fetched + c.stats.fetched }), { sent: 0, bounced: 0, failed: 0, cost: 0, tokens: 0, fetched: 0 });

  /* =====================================================================

  const TOKEN_RATE = { 'Claude 3.7 Sonnet': 0.000018, 'Claude 3.5 Sonnet': 0.000015, 'Claude 3.5 Haiku': 0.000004 };

      const batchSize = Math.min(rand(28, 42), run.leadsTarget - fetched.length);

      }
      setPhase(run, 'leadgen_crit', { leadgen: 'success', leadgen_crit: 'running' });

      const offIcp = Math.round(batchSize * CRIT_FAIL_RATE * Math.random());
      const verdict = offIcp > 4 ? 'FAIL' : 'PASS';

      } else {

        log(run, 'crit', `✖ LeadGen Critique: FAIL — ${offIcp} off-ICP records removed`, 2400);
        run.retries.leadgen++;
      }
      setPhase(run, 'leadgen_crit', { leadgen_crit: verdict === 'PASS' ? 'success' : 'failed' });

/* ---------- canvas chart helpers ---------- */
function lineChart(canvas, series, labels, color) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const max = Math.max(...series) * 1.15 || 1;
  const pad = 8, stepX = (w - pad * 2) / (series.length - 1);
  const pts = series.map((v, i) => [pad + i * stepX, h - pad - (v / max) * (h - pad * 2)]);
  // grid
  ctx.strokeStyle = 'rgba(148,163,184,.08)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, (h / 4) * i); ctx.lineTo(w, (h / 4) * i); ctx.stroke(); }
  // area
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '44'); grad.addColorStop(1, color + '00');
  ctx.beginPath(); ctx.moveTo(pts[0][0], h - pad); pts.forEach(p => ctx.lineTo(p[0], p[1])); ctx.lineTo(pts[pts.length - 1][0], h - pad); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // line
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
  // dots
  pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 2.4, 0, 7); ctx.fillStyle = color; ctx.fill(); });
}
function barChart(canvas, series, labels, colors) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const max = Math.max(...series) * 1.2 || 1;
  const bw = Math.min(38, (w / series.length) * .55);
  series.forEach((v, i) => {
    const x = (w / series.length) * (i + .5) - bw / 2;
    const bh = (v / max) * (h - 26);
    const g = ctx.createLinearGradient(0, h - 20 - bh, 0, h - 20);
    g.addColorStop(0, colors[i % colors.length]); g.addColorStop(1, colors[i % colors.length] + '33');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, h - 20 - bh, bw, bh, [5, 5, 0, 0]); ctx.fill();
    ctx.fillStyle = '#64748B'; ctx.font = '10px Inter'; ctx.textAlign = 'center';
    ctx.fillText(labels[i], x + bw / 2, h - 6);
  });
}

    if (loop && kids.length) { const k = kids[1]; html += `<path d="M${k.x + 90} ${k.y + 40} Q ${loop.x - 40} ${loop.y - 30}, ${loop.x - 70} ${loop.y}" fill="none" stroke="rgba(139,92,246,.35)" stroke-width="1.2" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.4s" repeatCount="indefinite"/></path>`; }
    svg.innerHTML = html;
  };
  setTimeout(drawWires, 60); window.addEventListener('resize', drawWires);

  const progress = { leadgen: { t: run ? run.leadsTarget : 0, d: 0 }, db: { t: 0, d: 0 }, email: { t: 0, d: 0 } };
  const setPg = (m) => { const p = progress[m]; const el = document.getElementById('pg-' + m); if (el && p.t) { el.style.width = Math.min(100, p.d / p.t * 100) + '%'; const tx = document.getElementById('pg-' + m + '-txt'); if (tx) tx.textContent = `${p.d}/${p.t}`; } };
  if (run) { progress.leadgen = { t: run.leadsTarget, d: run.phase !== 'leadgen' && run.phase !== 'queued' ? run.leadsTarget : 0 }; setPg('leadgen'); }

  const offLog = Backend.on('run-log', ({ campaignId: cid, line }) => { if (cid !== campaignId) return; paintLog(line); const r = document.getElementById('rt-tokens'); if (r) r.textContent = Backend.tok((Backend._db().runs[cid] || { tokens: 0 }).tokens); const co = document.getElementById('rt-cost'); if (co) co.textContent = Backend.money((Backend._db().runs[cid] || { cost: 0 }).cost); });
  const offState = Backend.on('run-state', ({ campaignId: cid, run: r }) => {
    if (cid !== campaignId) return;
    document.getElementById('rt-phase').textContent = r.phase;
    document.getElementById('rt-retries').textContent = r.retries.leadgen + r.retries.db + r.retries.email;
    Object.keys(r.nodes).forEach(k => {
      const el = document.getElementById('node-' + k), stEl = document.getElementById('node-state-' + k);
      if (!el) return; const st = r.nodes[k];
      el.classList.remove('running', 'success', 'failed');
      if (st === 'running' || st === 'success' || st === 'failed') el.classList.add(st);
      const d = NODE_DEFS[k];
      const inner = st === 'running' ? '<div class="spinner"></div>' : st === 'success' ? `<span style="color:var(--teal)">${icon('check', 14)}</span>` : st === 'failed' ? `<span style="color:var(--red)">${icon('x', 13)}</span>` : icon(d.i, 14);
      el.querySelector('.ai-orb').innerHTML = inner;
      stEl.textContent = st; stEl.style.color = st === 'running' ? 'var(--cyan)' : st === 'success' ? 'var(--teal)' : st === 'failed' ? 'var(--red)' : 'var(--text-3)';
    });
    if (r.phase === 'db') { progress.db.t = r.leadsTarget; }
    const vc = document.getElementById('verdicts');
    if (vc && r.verdicts.length) vc.innerHTML = r.verdicts.map(v => `<div style="flex:1;min-width:170px;background:rgba(148,163,184,.04);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12.5px">${v.module}</b>${chip(v.verdict, v.verdict === 'PASS' ? 'chip-teal' : 'chip-red')}</div><div style="font-size:11px;color:var(--text-3);margin-top:5px">${esc(v.detail)}</div></div>`).join('');
    setTimeout(drawWires, 50);
  });
  const offProg = Backend.on('run-progress', ({ campaignId: cid, module, done, total }) => { if (cid !== campaignId) return; progress[module] = { t: total, d: done }; if (module === 'email' && !progress.db.t) { progress.db = { t: total, d: total }; } if (module === 'email') setPg('db'); setPg(module); });
  const offDone = Backend.on('run-done', ({ campaignId: cid }) => { if (cid !== campaignId) return; toast('Run complete — results ready', 'ok'); setTimeout(() => navTo('results', cid), 1600); });
  const origRouter = router;
  const cleanup = () => { offLog(); offState(); offProg(); offDone(); };
  const obs = setInterval(() => { if (location.hash.indexOf('run/' + campaignId) !== 0 && location.hash !== '#/run/' + campaignId) { cleanup(); clearInterval(obs); } }, 800);
});
</script><script>

let LEAD_SEL = new Set();
route('leads', async (view) => {

      <div class="chip-select" id="lead-status-f">${['','New','Qualified','Contacted'].map(s=>`<button class="sel-chip ${s===''?'on':''}" data-s="${s}">${s||'All statuses'}</button>`).join('')}</div>

    </div>
    <div class="card" style="overflow:hidden"><div style="overflow-x:auto"><table class="data" id="lead-table"></table></div></div>
  </div>`;
  const state = { q: '', source: '', status: '' };
  const draw = () => {
    const rows = Backend._db().leads.filter(l =>
      (!state.q || (l.name+l.email+l.company+l.title).toLowerCase().includes(state.q)) &&
      (!state.source || l.source === state.source) && (!state.status || l.status === state.status));
    document.getElementById('lead-count').textContent = `${rows.length} enriched records · synced by DB Agent`;
    const allChecked = rows.length && rows.every(l => LEAD_SEL.has(l.id));

      <tbody>${rows.length ? rows.map(l => `<tr>
        <td><input type="checkbox" class="sel-row" data-id="${l.id}" ${LEAD_SEL.has(l.id)?'checked':''}></td>
        <td><b>${esc(l.name)}</b>${l.deduped?` <span class="chip chip-amber" style="font-size:9.5px;padding:1px 7px">dupe</span>`:''}</td>
        <td class="mono" style="font-size:12px">${esc(l.email)}</td>
        <td style="font-size:12px">${esc(l.title)}</td>
        <td style="font-size:12px">${esc(l.company)}</td>
        <td><span class="chip chip-gray">${esc(l.source)}</span></td>
        <td>${chip(l.status, l.status==='Qualified'?'chip-teal':l.status==='Contacted'?'chip-purple':'chip-cyan')}</td>
        <td>${chip(l.validation, l.validation==='Valid'?'chip-teal':'chip-amber', false)}</td>
        <td style="color:var(--text-3);font-size:12px">${timeAgo(l.fetchedAt)}</td></tr>`).join('')
      : `<tr><td colspan="9"><div class="empty-state">${icon('users',38)}<p>No leads match these filters.</p></div></td></tr>`}</tbody>`;
    document.getElementById('sel-all').onchange = e => { rows.forEach(l => e.target.checked ? LEAD_SEL.add(l.id) : LEAD_SEL.delete(l.id)); draw(); };
    document.querySelectorAll('.sel-row').forEach(cb => cb.onchange = () => { cb.checked ? LEAD_SEL.add(cb.dataset.id) : LEAD_SEL.delete(cb.dataset.id); syncBulk(); });

  draw();
});
async function bulkAction(a) { await Backend.bulkLeads([...LEAD_SEL], a); LEAD_SEL.clear(); toast('Bulk action applied', 'ok'); router(); }
function exportLeads() {
  const rows = Backend._db().leads.map(l => [l.name, l.email, l.title, l.company, l.source, l.status].join(','));
  const blob = new Blob(['name,email,title,company,source,status\n' + rows.join('\n')], { type: 'text/csv' });

    const r = rnd(i); const st = r < .78 ? (r < .5 ? 'Delivered' : r < .62 ? 'Opened' : 'Clicked') : r < .92 ? 'Bounced' : 'Failed';
    return st;

  <div class="fade-up">

      <div class="card card-pad"><div style="color:var(--text-2);font-size:12.5px;font-weight:600;margin-bottom:8px">Sent</div><div class="metric-num" style="color:var(--teal)">${s.sent}</div><div class="hint">${pct(s.sent, del)} of attempted</div></div>
      <div class="card card-pad"><div style="color:var(--text-2);font-size:12.5px;font-weight:600;margin-bottom:8px">Bounced</div><div class="metric-num" style="color:var(--amber)">${s.bounced}</div><div class="hint">${pct(s.bounced, del)} bounce rate</div></div>
      <div class="card card-pad"><div style="color:var(--text-2);font-size:12.5px;font-weight:600;margin-bottom:8px">Failed</div><div class="metric-num" style="color:var(--red)">${s.failed}</div><div class="hint">suppressed automatically</div></div>
      <div class="card card-pad"><div style="color:var(--text-2);font-size:12.5px;font-weight:600;margin-bottom:8px">Cost per send</div><div class="metric-num" style="color:var(--cyan)">${s.sent?Backend.money(c.cost.usd/s.sent):'—'}</div><div class="hint">vs $0.38 industry avg</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:18px" class="stagger">
      <div class="card card-pad">
        <div class="card-title">${icon('activity',15)} Engagement Funnel</div>
        <canvas id="res-chart" style="width:100%;height:200px;margin-top:12px"></canvas>
        <div style="display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--text-2)">
          <span>Open rate <b style="color:var(--cyan)">${pct(s.opened, s.sent)}</b></span>
          <span>Click rate <b style="color:var(--purple)">${pct(s.clicked, s.sent)}</b></span>
          <span>Click-to-open <b style="color:var(--teal)">${pct(s.clicked, s.opened)}</b></span>
        </div>
      </div>
      <div class="card card-pad">
        <div class="card-title">${icon('spark',15)} Personalization Sample <span class="chip chip-purple" style="margin-left:auto">${icon('bolt',11)} Bedrock</span></div>

          <div style="margin-top:10px">${chip('persona-matched', 'chip-teal', false)} ${chip('tone: consultative', 'chip-cyan', false)} ${chip('ICP-aligned', 'chip-purple', false)}</div>
